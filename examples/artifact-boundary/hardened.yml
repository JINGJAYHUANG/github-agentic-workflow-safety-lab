name: Hardened artifact metadata review
on:
  workflow_run:
    workflows: [Untrusted PR build]
    types: [completed]
permissions:
  actions: read
  contents: read
concurrency:
  group: inspect-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record immutable workflow identity only
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import json, os
          print(json.dumps({"head_sha": os.environ["HEAD_SHA"], "run_id": os.environ["RUN_ID"]}, sort_keys=True))
          PY
