name: Bootstrap public v0.1.0

on:
  push:
    branches: [feat/public-v0.1.0]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-public-v010.yml"

permissions:
  contents: write

concurrency:
  group: gawsl-bootstrap-v010
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Verify archive and publish readable source
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.bootstrap/source.tar.gz.b64.part-*)
          test "${#parts[@]}" -eq 10
          LC_ALL=C cat "${parts[@]}" > "$RUNNER_TEMP/source.tar.gz.b64"
          test "$(wc -c < "$RUNNER_TEMP/source.tar.gz.b64")" -eq 55360
          base64 --decode "$RUNNER_TEMP/source.tar.gz.b64" > "$RUNNER_TEMP/source.tar.gz"
          printf '%s  %s\n' \
            'ef6a5a92f84087779147812465a5bdc7fd9238310d7a0198024e31d001386d78' \
            "$RUNNER_TEMP/source.tar.gz" | sha256sum -c -

      - name: Safely extract source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          ARCHIVE="$RUNNER_TEMP/source.tar.gz" DEST="$RUNNER_TEMP/source" python - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          archive = Path(os.environ["ARCHIVE"])
          destination = Path(os.environ["DEST"]).resolve()

          with tarfile.open(archive, "r:gz") as bundle:
              for member in bundle.getmembers():
                  resolved = (destination / member.name).resolve()
                  if resolved != destination and destination not in resolved.parents:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f"unsafe archive member: {member.name}")
              bundle.extractall(destination, filter="data")
          PY

      - name: Run release gates on extracted source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          python -m pip install --disable-pip-version-check -e .
          python -m compileall -q src scripts tests
          python scripts/verify_test_count.py
          python -m unittest discover -s tests -v
          python scripts/check_fixture_safety.py
          gawsl verify-lab --root .
          gawsl scan . --config gawsl.toml --format text --fail-on high
          gawsl scan . --config gawsl.toml --format sarif --output "$RUNNER_TEMP/gawsl.sarif" --fail-on none
          python scripts/public_audit.py .
          python scripts/check_markdown_links.py

      - name: Publish verified readable source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/source/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish GitHub agentic workflow safety lab"
          git push origin HEAD:feat/public-v0.1.0
