name: Release

on:
  push:
    branches: [main]
    paths:
      - ".release/v0.1.0"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag, for example v0.1.0
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

concurrency:
  group: gawsl-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish release
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""
      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="v0.1.0"
          else
            version="$REQUESTED_VERSION"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version" >&2; exit 64; }
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "plain=${version#v}" >> "$GITHUB_OUTPUT"
      - name: Install package and build tooling
        run: python -m pip install --disable-pip-version-check -e . build wheel
      - name: Re-run release gates
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python scripts/verify_test_count.py
          python -m unittest discover -s tests -v
          python scripts/check_fixture_safety.py
          gawsl verify-lab --root .
          gawsl scan . --config gawsl.toml --fail-on high
          python scripts/public_audit.py .
          python scripts/check_markdown_links.py
      - name: Create or verify immutable tag through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq .object.sha 2>/dev/null)"; then
            test "$existing" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$VERSION" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi
      - name: Build release assets
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          PLAIN: ${{ steps.version.outputs.plain }}
          SOURCE_DATE_EPOCH: "1788048000"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          prefix="github-agentic-workflow-safety-lab-${PLAIN}/"
          git archive --format=tar --prefix="$prefix" "$GITHUB_SHA" | gzip -n > "dist/github-agentic-workflow-safety-lab-${PLAIN}.tar.gz"
          git archive --format=zip --prefix="$prefix" "$GITHUB_SHA" > "dist/github-agentic-workflow-safety-lab-${PLAIN}.zip"
          python -m build --wheel --outdir dist
          gawsl list-rules --json > dist/RULES.json
          gawsl verify-lab --root . --json > dist/LAB_VERIFICATION.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": "1.0",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "version": os.environ["VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "rules": 22,
              "example_pairs": 10,
              "tests": 88,
              "python_matrix": ["3.11", "3.12", "3.13"],
              "public_audit": "passed",
              "lab_verification": "passed"
          }
          Path("dist/RELEASE_PROVENANCE.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
          (cd dist && sha256sum \
            github-agentic-workflow-safety-lab-${PLAIN}.tar.gz \
            github-agentic-workflow-safety-lab-${PLAIN}.zip \
            github_agentic_workflow_safety_lab-${PLAIN}-py3-none-any.whl \
            RULES.json \
            LAB_VERIFICATION.json \
            RELEASE_PROVENANCE.json > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## GitHub Agentic Workflow Safety Lab v0.1.0

          A deterministic heuristic analyzer and executable teaching lab for GitHub Actions and agentic workflow trust boundaries.

          ### Included

          - 22 conventional and agent-specific rules.
          - Ten inert vulnerable/hardened workflow pairs.
          - Text, JSON, and SARIF output.
          - Expiring, scoped waivers.
          - Python 3.11–3.13 validation and reproducible wheel gate.

          ### Boundary

          A clean scan is not proof of security. This release does not execute the vulnerable examples, grant an agent secrets, or replace CodeQL, branch protection, environment approvals, runner isolation, or security review.
          EOF
          assets=(dist/*)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${assets[@]}" --clobber
            gh release edit "$VERSION" \
              --title "GitHub Agentic Workflow Safety Lab $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$VERSION" "${assets[@]}" \
              --title "GitHub Agentic Workflow Safety Lab $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi
