name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gawsl-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Enforce test floor
        run: python scripts/verify_test_count.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify inert lab fixtures
        run: python scripts/check_fixture_safety.py
      - name: Verify vulnerable and hardened pairs
        run: gawsl verify-lab --root .
      - name: Scan live workflows and hardened examples
        run: gawsl scan . --config gawsl.toml --format text --fail-on high
      - name: Generate SARIF smoke artifact
        run: gawsl scan . --config gawsl.toml --format sarif --output /tmp/gawsl.sarif --fail-on none
      - name: Audit public boundary
        run: python scripts/public_audit.py .
      - name: Check Markdown links
        run: python scripts/check_markdown_links.py

  reproducible-wheel:
    name: Reproducible wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""
      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check build wheel
      - name: Build twice with fixed epoch
        env:
          SOURCE_DATE_EPOCH: "1788048000"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          python -m build --wheel --outdir /tmp/build-a
          rm -rf build src/*.egg-info
          python -m build --wheel --outdir /tmp/build-b
          cmp /tmp/build-a/*.whl /tmp/build-b/*.whl
          sha256sum /tmp/build-a/*.whl
